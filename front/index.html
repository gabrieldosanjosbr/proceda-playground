<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#008779" />

    <title>PROCEDA — Playground</title>
    <meta
            name="description"
            content="Explore os layouts EDI PROCEDA em um playground interativo. Visualize registros, campos e estruturas dos documentos NOTFIS, OCOREN, DOCCOB e CONEMB."
    />

    <link rel="canonical" href="https://proceda-playground.pages.dev/" />
    <link rel="icon" type="image/png" href="/box-light.png" />

    <!-- Open Graph: LinkedIn e outras redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PROCEDA" />
    <meta property="og:title" content="PROCEDA — Playground" />
    <meta
            property="og:description"
            content="Explore os layouts EDI PROCEDA em um playground interativo para visualizar registros, campos e estruturas de documentos."
    />
    <meta
            property="og:url"
            content="https://proceda-playground.pages.dev/"
    />
    <meta
            property="og:image"
            content="https://proceda-playground.pages.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PROCEDA — Playground para explorar layouts EDI" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROCEDA — Playground" />
    <meta
            name="twitter:description"
            content="Explore e visualize os layouts EDI PROCEDA em um playground interativo."
    />
    <meta
            name="twitter:image"
            content="https://proceda-playground.pages.dev/og-image.png"
    />

    <script>
      try {
        const savedTheme = localStorage.getItem('proceda-theme');
        const dark = savedTheme
                ? savedTheme === 'dark'
                : matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PROCEDA Playground",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Playground interativo para explorar layouts EDI PROCEDA.",
        "url": "https://proceda-playground.pages.dev/",
        "isAccessibleForFree": true,
        "codeRepository": "https://github.com/gabrieldosanjosbr/proceda"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
